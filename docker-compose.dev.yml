# Optionnel : Mailpit via Docker (préférer `make mailpit` = binaire local).
# Docker overlay échoue souvent sur live USB / root overlay : d'où le binaire.
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: kouziacrm-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
