# Image unique partagée par app / worker / prisma-studio (1 seul build).
services:
  app:
    build: .
    image: kouzia-erp:latest
    container_name: kouzia-erp-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/kouziacrm.db
      API_PORT: "3000"
      WEB_DIST: /app/apps/web/dist
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    image: kouzia-erp:latest
    container_name: kouzia-erp-worker
    restart: unless-stopped
    command: ["npx", "tsx", "--env-file=.env", "--tsconfig", "apps/api/tsconfig.json", "scripts/worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/kouziacrm.db
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      app:
        condition: service_healthy

  # Prisma Studio lit et écrit toute la base sans authentification : jamais lancé par défaut (audit du 27/10/2026).
  # À la demande seulement : docker compose --profile studio up prisma-studio, puis arrêter après usage.
  prisma-studio:
    image: kouzia-erp:latest
    container_name: kouzia-erp-studio
    profiles: ["studio"]
    restart: "no"
    command: ["npx", "prisma", "studio", "--hostname", "0.0.0.0", "--port", "5555"]
    ports:
      - "127.0.0.1:5555:5555"
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/kouziacrm.db
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro

  # Décommenter sur Proxmox pour l'accès HTTPS via Cloudflare Tunnel.
  # cloudflared tourne alors dans un autre conteneur : renseigner TRUST_PROXY dans .env avec le
  # sous-réseau Docker (ex. "172.18.0.0/16"), sinon l'API ne lit pas CF-Connecting-IP et toutes
  # les requêtes du tunnel partagent l'IP du conteneur (limites de débit communes).
  # Jeton du tunnel lu dans un fichier, jamais dans le .env (comme sur le CT Alpine, 27/10/2026) :
  #   install -m 600 -o 65532 -g 65532 /dev/null /etc/kouzia/cloudflare-tunnel.token, puis y coller le jeton
  #   (65532 : compte « nonroot » de l'image cloudflared, seul lecteur du fichier) ; CLOUDFLARE_TUNNEL="1" dans le .env.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: kouzia-erp-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
  #   secrets:
  #     - cloudflare_tunnel_token

# Avec le service cloudflared ci-dessus (au niveau racine du fichier) :
# secrets:
#   cloudflare_tunnel_token:
#     file: /etc/kouzia/cloudflare-tunnel.token
