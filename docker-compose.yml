services:
  app:
    build: .
    container_name: kouziacrm-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/kouziacrm.db
      API_PORT: "3000"
      WEB_DIST: /app/apps/web/dist
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro

  worker:
    build: .
    container_name: kouziacrm-worker
    restart: unless-stopped
    command: ["npx", "tsx", "--env-file=.env", "--tsconfig", "apps/api/tsconfig.json", "scripts/worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/kouziacrm.db
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - app

  prisma-studio:
    build: .
    container_name: kouziacrm-studio
    restart: unless-stopped
    command: ["npx", "prisma", "studio", "--hostname", "0.0.0.0", "--port", "5555"]
    ports:
      - "127.0.0.1:5555:5555"
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/kouziacrm.db
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro

  # Décommenter sur Proxmox pour l'accès HTTPS via Cloudflare Tunnel
